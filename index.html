<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tutor Pro - إدارة الحصص والدخل</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .summary-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 15px;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f1f5f9;
        }
        .actions-cell button {
            padding: 5px 10px;
            font-size: 12px;
            margin: 2px;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Tutor Pro</h2>
    
    <!-- نموذج المدخلات -->
    <div class="form-group">
        <label for="studentName">اسم الطالب:</label>
        <input type="text" id="studentName" placeholder="أدخل اسم الطالب">
    </div>

    <div class="form-group">
        <label for="sessionTime">وقت الحصة:</label>
        <input type="time" id="sessionTime">
    </div>

    <div class="form-group">
        <label for="coursePrice">سعر الدورة / الحصة:</label>
        <input type="number" id="coursePrice" placeholder="القيمة المالية">
    </div>

    <div class="form-group">
        <label for="weeksCount">عدد الأسابيع / الحصص:</label>
        <input type="number" id="weeksCount" value="4" placeholder="عدد الأسابيع">
    </div>

    <button onclick="addStudentData()">إضافة وحفظ البيانات</button>

    <!-- ملخص الدخل -->
    <div class="summary-box" id="incomeSummary">
        إجمالي الدخل المتوقع: 0.00
    </div>

    <!-- جدول عرض البيانات المدخلة -->
    <div style="overflow-x: auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>الطالب</th>
                    <th>الوقت</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                    <th>إدارة</th>
                </tr>
            </thead>
            <tbody>
                <!-- يتم تعبئة البيانات برمجياً -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('tutor_records')) || [];

    function saveData() {
        localStorage.setItem('tutor_records', JSON.stringify(records));
    }

    function addStudentData() {
        const name = document.getElementById('studentName').value.trim();
        const time = document.getElementById('sessionTime').value;
        const price = parseFloat(document.getElementById('coursePrice').value) || 0;
        const weeks = parseInt(document.getElementById('weeksCount').value) || 1;

        if (!name) {
            alert('الرجاء إدخال اسم الطالب على الأقل.');
            return;
        }

        const totalDue = price * weeks;

        const newRecord = {
            id: Date.now(),
            name: name,
            time: time || 'غير محدد',
            price: totalDue,
            status: 'مرحلة 1: مسجل'
        };

        records.push(newRecord);
        saveData();
        renderTable();
        
        // تفريغ الحقول
        document.getElementById('studentName').value = '';
        document.getElementById('coursePrice').value = '';
    }

    function updateStatus(id) {
        const record = records.find(r => r.id === id);
        if (record) {
            if (record.status.includes('1')) record.status = 'مرحلة 2: قيد الدفع';
            else if (record.status.includes('2')) record.status = 'مرحلة 3: تم الاستلام';
            else if (record.status.includes('3')) record.status = 'مرحلة 4: مكتمل ومؤرشف';
            else record.status = 'مرحلة 1: مسجل';
            
            saveData();
            renderTable();
        }
    }

    function deleteRecord(id) {
        records = records.filter(r => r.id !== id);
        saveData();
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        let totalIncome = 0;

        records.forEach(rec => {
            totalIncome += rec.price;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rec.name}</td>
                <td>${rec.time}</td>
                <td>${rec.price}</td>
                <td>${rec.status}</td>
                <td class="actions-cell">
                    <button onclick="updateStatus(${rec.id})" style="background-color: var(--success-color);">الحالة</button>
                    <button onclick="deleteRecord(${rec.id})" style="background-color: #dc2626;">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('incomeSummary').innerText = `إجمالي الدخل المتوقع والمحصل: ${totalIncome.toFixed(2)} ريال`;
    }

    // التشغيل عند التحميل
    renderTable();
</script>

</body>
</html>
