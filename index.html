<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tutor - Mr. Karam Ismail</title>
    <style>
        body {
            margin: 0;
            background: #0F172A;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            padding: 10px;
        }
        header {
            background: #1E293B;
            padding: 12px;
            border-bottom: 2px solid #FACC15;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }
        .logo { font-size: 15px; font-weight: bold; color: #FACC15; }
        
        .teacher-box {
            background: #1E293B;
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(250,204,21,0.3);
            font-weight: bold;
            color: #FACC15;
        }

        /* Schedule */
        .day-box {
            background: rgba(255,255,255,0.05);
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .day-name {
            background: #FACC15;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            min-width: 35px;
            text-align: center;
        }
        .slots-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex: 1;
        }
        .slot-pill {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            font-weight: bold;
        }

        /* Accounting Table */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 8px;
            padding: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #000;
            font-size: 11px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 6px 4px;
            text-align: center;
        }
        th {
            background: #1E293B;
            color: #fff;
        }
        .student-name-col {
            font-weight: bold;
            color: #fff;
            text-align: right;
            padding-right: 8px;
        }
        .pay-week {
            background: #fef3c7 !important;
        }
        
        /* Checkbox Box */
        .box {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #94a3b8;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .not-paid { background: #fee2e2; color: #b91c1c; }
        .is-paid { background: #d1fae5; color: #047857; }

        .total-footer {
            background: #FACC15;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Smart Tutor</div>
    <div style="font-size: 12px; color: #FACC15;">Mr. Karam Ismail</div>
</header>

<div class="teacher-box">
    👤 الأستاذ: كرم إسماعيل
</div>

<!-- Schedule Section -->
<div id="scheduleSection"></div>

<!-- Financial Table -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>الطالب</th>
                <th>W1</th>
                <th>W2</th>
                <th>W3</th>
                <th class="pay-week">W4</th>
                <th>الإجمالي</th>
            </tr>
        </thead>
        <tbody id="accBody"></tbody>
        <tfoot id="accFooter"></tfoot>
    </table>
</div>

<script>
    const dataKey = "karam_tutor_clean_db_v1";
    const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

    let db = JSON.parse(localStorage.getItem(dataKey)) || {
        students: [
            { id: 's1', name: 'آدم', color: '#EF4444', price: 200, payments: {} },
            { id: 's2', name: 'الفريدة', color: '#10B981', price: 200, payments: {} },
            { id: 's3', name: 'القحطاني', color: '#8B5CF6', price: 200, payments: {} },
            { id: 's4', name: 'خلودي', color: '#06B6D4', price: 200, payments: {} },
            { id: 's5', name: 'فارس', color: '#3B82F6', price: 200, payments: {} },
            { id: 's6', name: 'النعيم', color: '#F59E0B', price: 200, payments: {} },
            { id: 's7', name: 'المري', color: '#EC4899', price: 200, payments: {} }
        ],
        schedule: {
            'السبت': [{time: '11:30 AM', id: 's1'}, {time: '3:15 PM', id: 's2'}],
            'الأحد': [{time: '3:45 PM', id: 's1'}, {time: '5:00 PM', id: 's2'}],
            'الإثنين': [{time: '3:45 PM', id: 's1'}],
            'الثلاثاء': [{time: '4:15 PM', id: 's2'}],
            'الأربعاء': [{time: '2:00 PM', id: 's1'}],
            'الخميس': [{time: '2:00 PM', id: 's3'}],
            'الجمعة': []
        }
    };

    function saveData() {
        localStorage.setItem(dataKey, JSON.stringify(db));
        render();
    }

    function togglePay(studentId, weekIdx) {
        if (!db.students.find(s => s.id === studentId).payments) {
            db.students.find(s => s.id === studentId).payments = {};
        }
        let current = db.students.find(s => s.id === studentId).payments[weekIdx] || false;
        db.students.find(s => s.id === studentId).payments[weekIdx] = !current;
        saveData();
    }

    function render() {
        // Render Schedule
        let schedHtml = '';
        days.forEach(day => {
            let slots = db.schedule[day] || [];
            schedHtml += `<div class="day-box"><div class="day-name">${day}</div><div class="slots-container">`;
            if (slots.length === 0) {
                schedHtml += `<span style="color:#94a3b8; font-size:10px;">لا توجد مواعيد</span>`;
            } else {
                slots.forEach(slot => {
                    let st = db.students.find(s => s.id === slot.id);
                    let name = st ? st.name : '';
                    let color = st ? st.color : '#334155';
                    schedHtml += `<div class="slot-pill" style="background:${color}; color:#fff;">${name} (${slot.time})</div>`;
                });
            }
            schedHtml += `</div></div>`;
        });
        document.getElementById('scheduleSection').innerHTML = schedHtml;

        // Render Table
        let bodyHtml = '';
        let totals = [0, 0, 0, 0];
        let grandTotalSum = 0;

        db.students.forEach(st => {
            let studentSum = 0;
            bodyHtml += `<tr><td class="student-name-col" style="background:${st.color};">${st.name}</td>`;
            
            for (let i = 0; i < 4; i++) {
                let isPaid = st.payments?.[i] || false;
                if (isPaid) {
                    studentSum += st.price;
                    totals[i] += st.price;
                }
                bodyHtml += `
                    <td class="${i === 3 ? 'pay-week' : ''}">
                        <div class="box ${isPaid ? 'is-paid' : 'not-paid'}" onclick="togglePay('${st.id}', ${i})">
                            ${isPaid ? '✓' : ''}
                        </div>
                    </td>
                `;
            }
            bodyHtml += `<td style="font-weight:bold; background:#f8fafc;">${studentSum}</td></tr>`;
            grandTotalSum += studentSum;
        });
        document.getElementById('accBody').innerHTML = bodyHtml;

        let footerHtml = `<tr class="total-footer"><td style="text-align:right; padding-right:8px;">الإجمالي</td>`;
        totals.forEach(t => { footerHtml += `<td>${t}</td>`; });
        footerHtml += `<td>${grandTotalSum}</td></tr>`;
        document.getElementById('accFooter').innerHTML = footerHtml;
    }

    render();
</script>

</body>
</html>
