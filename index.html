<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0F172A;--gold:#FACC15;--slate:#1E293B;--primary:#6366f1;--hol:#312E81}
body{margin:0;background:var(--bg);color:#fff;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:var(--slate);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:1000}
.action-btn{background:var(--gold);color:#000;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer;margin-left:5px;display:inline-flex;align-items:center;gap:4px;font-size:11px}
.acc-icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 30% 30%,#334155,#0F172A);color:var(--gold);font-size:17px;cursor:pointer;padding:0;margin-right:4px}
.container{padding:10px}
.teacher-box{display:flex;align-items:center;gap:10px;background:var(--slate);padding:10px;border-radius:10px;margin-bottom:15px;border:1px solid rgba(250,204,21,.2)}
.profile-img-container{width:50px;height:50px;flex-shrink:0;border-radius:50%;border:2px solid var(--gold);background:#334155;overflow:hidden;cursor:pointer}
.profile-img{width:100%;height:100%;object-fit:cover}
#teacherName{background:transparent;color:var(--gold);border:none;border-bottom:1px solid #444;font-size:16px;width:100%;font-weight:900;outline:none}
.day-row{display:flex;background:rgba(255,255,255,.05);margin-bottom:4px;border-radius:6px;min-height:48px}
.day-label{width:55px;background:var(--gold);color:#000;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px 0 0 6px}
.slots{flex:1;display:flex;gap:2px;padding:5px 6px;align-items:center;min-height:48px;box-sizing:border-box}
.slots.drag-over{background:rgba(250,204,21,.25)}
.slot{flex:1 1 0;min-width:0;max-width:64px;padding:3px 1px;font-size:8.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:5px;text-align:center;border:1px solid rgba(255,255,255,.15);cursor:grab;user-select:none;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.acc-table-wrapper{width:100%;overflow-x:auto;background:#fff;border-radius:10px;margin-top:15px}
.acc-table{border-collapse:collapse;color:#1E293B}
.acc-table th,.acc-table td{border:1px solid #e2e8f0;text-align:center;padding:4px 1px;min-width:25px}
.acc-table th{background:#1E293B;color:#fff;font-size:8px;cursor:pointer}
.grand-total-cell{background:#000!important;color:var(--gold)!important;font-size:11px}
.sticky-name{position:sticky;left:0;z-index:100;width:120px;font-weight:900;border-right:2px solid #ddd!important;text-align:left!important;padding:4px 6px!important;color:#fff!important;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-price{font-size:9px;opacity:.95}
.box{width:19px;height:24px;border-radius:4px;border:1px solid #cbd5e1;background:#fff;margin:auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#000;cursor:pointer}
.is-pay-week{border:2px solid #b45309!important;background:#fef3c7!important}
.status-paid{background:#d1fae5!important;color:#047857}
.status-notpaid{background:#fee2e2!important;color:#b91c1c}
.status-disabled{background:#374151!important;color:#fff!important}
.is-holiday-col{background:var(--hol)!important;color:#fff!important}
.is-holiday-cell{background:rgba(49,46,129,.4)!important}
.sidebar,.modal{position:fixed;top:0;left:-110%;width:320px;height:100%;background:#fff;z-index:3000;transition:.3s;color:#1E293B;padding:20px;box-sizing:border-box;overflow-y:auto;box-shadow:5px 0 15px rgba(0,0,0,.5)}
.active{left:0!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:2500}
.overlay.active{display:block}
input,select{width:100%;padding:8px;margin:5px 0 12px;border:1px solid #ddd;border-radius:8px;font-weight:bold;font-size:12px;box-sizing:border-box}
.box-card{background:#f8fafc;padding:10px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:15px}
.period-card{background:#f1f5f9;padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid #cbd5e1;position:relative}
.color-circle{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-circle.selected{border-color:#000;transform:scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
.distance-badge{display:inline-block;background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px}
.addr-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}.addr-row input{margin:0}
.loc-icon-btn,.map-icon-btn{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#0ea5e9;color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer}
.map-icon-btn{background:#f1f5f9;border:1px solid #cbd5e1;color:#000;width:36px;height:36px}
#mapModal{display:none;width:100%;z-index:5000;padding:0;transition:none;flex-direction:column;left:0}
#mapModal.active{display:flex}
.map-top-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;position:relative;z-index:5002}
#mapSearchInput{flex:1;margin:0}
#mapSearchResults{position:absolute;top:56px;left:12px;right:12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5003;max-height:240px;overflow-y:auto;display:none}
.map-search-item{padding:10px 12px;font-size:11.5px;border-bottom:1px solid #f1f5f9;cursor:pointer}
#pickerMap{width:100%;flex:1;min-height:0}
.map-fab-stack{position:fixed;right:14px;bottom:96px;display:flex;flex-direction:column;gap:10px;z-index:5002}
.locate-fab{background:#fff;border:1px solid #cbd5e1;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.map-bottom-bar{padding:10px 14px 14px;background:#fff;position:relative;z-index:5002}
.map-status{font-size:11px;color:#64748b;margin:0 0 8px;text-align:center}
#studentPrintContainer{display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#facc15;padding:10px 20px;border-radius:8px;font-weight:bold;z-index:4000;transition:transform .3s;border:1px solid #facc15}
#toast.show{transform:translateX(-50%) translateY(0)}
.acc-card{border:1px solid #e2e8f0;border-left:5px solid #3b82f6;border-radius:8px;padding:8px;margin-bottom:10px}
.acc-card h4{margin:0 0 4px;font-size:14px}
.acc-mini{width:100%;border-collapse:collapse;font-size:10.5px;margin:4px 0}
.acc-mini th,.acc-mini td{border:1px solid #e2e8f0;padding:3px 4px;text-align:center}
.acc-mini th{background:#f1f5f9;color:#334155}
.acc-mini .l{text-align:left}
.acc-owe{color:#b91c1c}
.acc-note{font-size:10.5px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:6px;padding:6px 8px;margin:6px 0}
.acc-h{cursor:grab;touch-action:none;user-select:none;font-size:16px;color:#64748b;width:24px}
.acc-row-over{outline:2px solid #16a34a;background:#dcfce7!important}
.acc-row-drag{opacity:.45}
.acc-badge{display:inline-block;background:#16a34a;color:#fff;border-radius:8px;padding:0 5px;font-size:9px;font-weight:bold;margin-left:3px;cursor:pointer}
.acc-badge.src{background:#f59e0b;color:#000}
#accGhost{position:fixed;z-index:9999;pointer-events:none;background:#facc15;color:#000;font-weight:bold;font-size:11px;padding:4px 8px;border-radius:8px}
/* frame + fit for print / image export */
#printArea{position:relative}
.fc,.fm{display:none}
.fc{position:absolute;width:14px;height:14px;border:3px solid var(--gold);pointer-events:none}
.fc.tl{top:5px;left:5px;border-right:0;border-bottom:0}.fc.tr{top:5px;right:5px;border-left:0;border-bottom:0}
.fc.bl{bottom:5px;left:5px;border-right:0;border-top:0}.fc.br{bottom:5px;right:5px;border-left:0;border-top:0}
.fm{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);background:var(--bg);padding:0 8px;font-size:12px;line-height:1}
.fm.t{top:-8px}.fm.b{bottom:-8px}
.print-fit,.exporting{border:3px double var(--gold);border-radius:16px;padding:20px 18px;background:var(--bg);box-sizing:border-box}
.print-fit .fc,.exporting .fc,.print-fit .fm,.exporting .fm{display:block}
.print-fit{width:1080px!important;margin:0 auto!important}
.exporting{width:1400px!important}
:is(.print-fit,.exporting) :is(.acc-table-wrapper,.slots){overflow:visible!important}
:is(.print-fit,.exporting) .acc-table{width:100%!important;table-layout:fixed!important}
:is(.print-fit,.exporting) :is(.acc-table th,.acc-table td){min-width:0!important}
:is(.print-fit,.exporting) .sticky-name{position:static!important;width:90px!important}
.print-fit .acc-table th{font-size:6.5px!important;padding:3px 0!important}
.print-fit .sticky-name{font-size:8.5px!important}.print-fit .sub-price{font-size:7px!important}
.print-fit .box{width:14px!important;height:18px!important;font-size:9px!important}
@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
html,body{background:#0F172A!important;margin:0!important;padding:0!important;height:auto!important}
header,.sidebar,.modal,.overlay,#toast{display:none!important}
body.print-single .container{display:none!important}
body.print-single #studentPrintContainer{display:block!important}
.container{padding:0!important}
.day-row,.acc-table-wrapper{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="modal" id="editModal"><div id="editFields"></div></div>

<div class="modal" id="accountModal" style="width:min(100%,480px)">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Account Statement 💰</h3><div class="map-icon-btn" onclick="closeAll()">✕</div></div>
<label style="font-size:11px;color:#64748b">Choose student</label>
<select id="accStudent" onchange="runAccount()"></select>
<label style="font-size:11px;color:#64748b">Account up to this date (that day is included)</label>

<button class="action-btn" style="flex:1;margin:0;justify-content:center;padding:10px;background:#0f172a;color:#fff" onclick="printAccountReport()">🖨️ PDF</button>
<button class="action-btn" style="flex:1;margin:0;justify-content:center;padding:10px;background:#10b981;color:#fff" onclick="accountImages(false)">📸 Image</button>

</div>

</div>

<div class="modal" id="mapModal">

<div class="map-icon-btn" onclick="closeAll()">✕</div>
<input id="mapSearchInput" placeholder="Search, or paste coordinates / a Google Maps link..." onkeydown="if(event.key==='Enter'){event.preventDefault();searchMapLocation()}">
<div class="map-icon-btn" onclick="searchMapLocation()">🔍</div>

</div>

</div>

<button class="action-btn" style="width:100%;background:#10b981;color:#fff" onclick="confirmMapPicker()">✅ Confirm This Location</button>
</div>
</div>

<div id="studentPrintContainer"></div>
<div id="toast"></div>

<div class="modal" id="exportModal" style="width:min(100%,300px)">
<h3 style="margin-top:0">Export 🖨️</h3>
<button class="action-btn" style="width:100%;margin:0 0 8px;padding:12px;justify-content:center;background:#0f172a;color:#fff" onclick="exportSchedule('pdf')">🖨️ PDF (Landscape)</button>
<button class="action-btn" style="width:100%;margin:0 0 8px;padding:12px;justify-content:center;background:#10b981;color:#fff" onclick="exportSchedule('image')">📸 Image</button>
<button class="action-btn" style="width:100%;margin:0;padding:12px;justify-content:center;background:#0ea5e9;color:#fff" onclick="exportSchedule('share')">📤 Share</button>

<input id="teacherPhoneInput" placeholder="e.g. +1 555 0100" oninput="db.teacherPhone=this.value;save()">
</div>
<div class="box-card">

<input id="teacherAddressInput" placeholder="Address / area" oninput="db.teacherAddress=this.value">
<button class="loc-icon-btn" onclick="openMapPicker('teacher')">📍</button>
</div>

</div>

<input id="courseBaseDate" type="date">

<input type="file" id="importFile" hidden accept=".json" onchange="importBackup(this)">

<header>

<div class="container">

<img id="teacherImg" class="profile-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
</div>

<script>
const PALETTE=['#DC2626','#F97316','#D97706','#A16207','#65A30D','#16A34A','#047857','#0D9488','#06B6D4','#0284C7','#2563EB','#1E3A8A','#4F46E5','#7C3AED','#A855F7','#C026D3','#EC4899','#E11D48','#9F1239','#78350F','#3F6212','#701A75','#6B7280','#A8875A'];
const DAYS=["Sat","Sun","Mon","Tue","Wed","Thu"];
const FULL={Sat:"Saturday",Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday"};
const JS_DAY={Sat:6,Sun:0,Mon:1,Tue:2,Wed:3,Thu:4};
const DAY_MS=86400000,REG=[25.3838,49.5922];
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
let db;
try{db=JSON.parse(localStorage.getItem('tutor_v390'))||{}}catch(e){db={}}
db.students=db.students||[];db.holidays=db.holidays||[];db.teacherName=db.teacherName||'';db.teacherPhone=db.teacherPhone||'';db.courseStartDate=db.courseStartDate||today();
let history=[],dragged=null;

const pickScale=(w,h)=>Math.max(1.5,Math.min(4,Math.sqrt(14e6/(Math.max(1,w)*Math.max(1,h)))));
const escHtml=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round((Number(n)||0)*100)/100;
const money=n=>round2(n).toLocaleString('en-US',{maximumFractionDigits:2});
function showToast(m){const t=$('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function timeOptions(sel=''){let h='';for(let H=10;H<=22;H++)for(const m of[0,15,30,45]){if(H==22&&m)continue;const t=`${H>12?H-12:H}:${String(m).padStart(2,'0')} ${H<12?'AM':'PM'}`;h+=`<option ${t===sel?'selected':''}>${t}</option>`}return h}
function timeToMinutes(t){const p=(t||'').split(' ');if(p.length<2)return 0;let[h,m]=p[0].split(':').map(Number);if(p[1]==='PM'&&h!==12)h+=12;if(p[1]==='AM'&&h===12)h=0;return h*60+m}
function save(){try{localStorage.setItem('tutor_v390',JSON.stringify(db))}catch(e){}render()}
function commitChange(){history.push(JSON.stringify(db));save()}
function undo(){if(history.length){db=JSON.parse(history.pop());save()}}
function closeAll(){document.querySelectorAll('.sidebar,.modal,.overlay').forEach(e=>e.classList.remove('active'))}
function openModal(id){closeAll();$(id).classList.add('active');$('overlay').classList.add('active')}
const toggleSidebar=()=>openModal('sidebar');
const openExportMenu=()=>openModal('exportModal');
const openEditModal=()=>openModal('editModal');

/* ===== Maps / geocoding ===== */
async function placesSearch(q,limit=8,lat=null,lon=null){
  let out=[];
  try{const r=await(await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=${limit}`+(lat!=null?`&lat=${lat}&lon=${lon}&location_bias_scale=0.9`:''))).json();
    out=(r.features||[]).map(f=>{const p=f.properties||{};return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],display_name:[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).join(', ')||q}})}catch(e){}
  if(!out.length)try{const r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=${limit}&q=${encodeURIComponent(q)}`)).json();
    out=r.map(x=>({lat:+x.lat,lon:+x.lon,display_name:x.display_name}))}catch(e){}
  return out.slice(0,limit);
}
async function geocodeAddress(a){
  if(!a||!a.trim())return null;
  const r=await placesSearch(a,1,db.teacherLat??REG[0],db.teacherLat!=null?db.teacherLng:REG[1]);
  return r.length?{lat:r[0].lat,lng:r[0].lon}:null;
}
async function reverseGeocode(lat,lng){
  try{const d=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`)).json();if(d&&d.display_name)return d.display_name}catch(e){}
  return null;
}
function haversineKm(a,b,c,d){const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
const distTo=(lat,lng)=>Math.round(haversineKm(db.teacherLat,db.teacherLng,lat,lng)*10)/10;
async function recalcAllDistances(){
  if(db.teacherLat==null)return;
  for(const s of db.students){
    if(s.address&&s.lat==null){const l=await geocodeAddress(s.address);if(l){s.lat=l.lat;s.lng=l.lng}await new Promise(r=>setTimeout(r,1000))}
    if(s.lat!=null)s.distanceKm=distTo(s.lat,s.lng);
  }
  save();
}
let map,marker,pickerCtx,streetL,satL,isSat=false,found=[];
function ensureMap(lat,lng){
  const has=lat!=null,la=has?lat:REG[0],lo=has?lng:REG[1];
  if(!map){
    map=L.map('pickerMap').setView([la,lo],has?16:11);
    streetL=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    satL=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
    marker=L.marker([la,lo],{draggable:true}).addTo(map);
    marker.on('dragend',mapStatus);
    map.on('click',e=>{marker.setLatLng(e.latlng);mapStatus()});
  }else{map.setView([la,lo],has?16:11);marker.setLatLng([la,lo])}
  setTimeout(()=>map.invalidateSize(),200);mapStatus();
}
function toggleSatellite(){
  if(!map)return;isSat=!isSat;
  map.removeLayer(isSat?streetL:satL);(isSat?satL:streetL).addTo(map);$('satBtn').innerText=isSat?'🗺️':'🛰️';
}
function mapStatus(){const l=marker.getLatLng();$('mapPickerStatus').innerText=`Coordinates: ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`}
function parseCoords(q){
  q=q.trim();let m=q.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/)||q.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||q.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||q.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  return m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180?{lat:+m[1],lng:+m[2]}:null;
}
async function searchMapLocation(){
  const q=$('mapSearchInput').value.trim(),box=$('mapSearchResults');
  if(!q){box.style.display='none';return}
  box.style.display='block';
  const c=parseCoords(q);
  if(c){marker.setLatLng([c.lat,c.lng]);map.setView([c.lat,c.lng],17);mapStatus();box.innerHTML='<div class="map-search-item">✅ Jumped to the pasted location</div>';setTimeout(()=>box.style.display='none',1200);return}
  if(/(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(q)){box.innerHTML='<div class="map-search-item">Short Google links can\'t be read here. Open it in your browser and paste the full link (contains @lat,lng) or the coordinates.</div>';return}
  box.innerHTML='<div class="map-search-item">⏳ Searching...</div>';
  const g=`<div class="map-search-item" style="color:#0ea5e9;font-weight:bold" onclick="window.open('https://www.google.com/maps/search/${encodeURIComponent(q)}','_blank')">🔎 Not found? Open on Google Maps and paste the coordinates here</div>`;
  const c2=map.getCenter();
  found=await placesSearch(q,8,c2.lat,c2.lng);
  box.innerHTML=(found.length?found.map((r,i)=>`<div class="map-search-item" onclick="pickResult(${i})">📍 ${escHtml(r.display_name)}</div>`).join(''):'<div class="map-search-item">No results.</div>')+g;
}
function pickResult(i){
  const r=found[i];if(!r)return;
  marker.setLatLng([r.lat,r.lon]);map.setView([r.lat,r.lon],16);
  $('mapSearchInput').value=r.display_name;$('mapSearchResults').style.display='none';mapStatus();
}
function openMapPicker(ctx){
  pickerCtx=ctx;let la=null,ln=null,typed='';
  if(ctx==='teacher'){typed=$('teacherAddressInput').value.trim();if(db.teacherLat!=null){la=db.teacherLat;ln=db.teacherLng}}

  if(la==null&&db.teacherLat!=null){la=db.teacherLat;ln=db.teacherLng}
  $('mapSearchInput').value=typed;$('mapSearchResults').style.display='none';

function useMyLocationInPicker(silent){
  if(!navigator.geolocation){if(!silent)alert("This browser doesn't support location detection");return}
  $('mapPickerStatus').innerText='⏳ Finding your location...';
  navigator.geolocation.getCurrentPosition(p=>{ensureMap(p.coords.latitude,p.coords.longitude)},()=>{$('mapPickerStatus').innerText=silent?'':'⚠️ Could not get your location, drag the pin'},{enableHighAccuracy:true,timeout:10000});
}
async function confirmMapPicker(){
  if(!marker){closeAll();return}
  const ll=marker.getLatLng();$('mapPickerStatus').innerText='⏳ Saving location...';
  const addr=await reverseGeocode(ll.lat,ll.lng);

/* ===== Payment periods ===== */
const ymdToUTC=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null};
function courseEndYMD(){
  if(db.courseEndDate)return db.courseEndDate;
  const st=db.courseStartDate,y=+st.slice(0,4);let e=y+'-07-01';if(e<st)e=(y+1)+'-07-01';return e;
}
function reportWeeks(){const b=ymdToUTC(db.courseStartDate),e=ymdToUTC(courseEndYMD());return(b==null||e==null||e<b)?24:Math.floor((e-b)/(7*DAY_MS))+1}
const fmtUTC=(ms,o)=>new Date(ms).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const fmtShort=ms=>fmtUTC(ms,{day:'numeric',month:'short'});
const fmtLong=ms=>fmtUTC(ms,{day:'numeric',month:'short',year:'numeric'});
function getPeriods(s,partial=false){
  const base=ymdToUTC(db.courseStartDate);if(base==null)return[];
  const prices=(s.periods||[]).map(p=>({price:Number(p.price)||0,cycle:Number(p.cycle)||4,startMs:ymdToUTC(p.startDate)})).filter(p=>p.startMs!=null).sort((a,b)=>a.startMs-b.startMs);
  if(!prices.length)return[];
  const hol=db.holidays,fm=s.financialMap||{},skipped=j=>hol.includes(j)||fm[j]==3,payDate=j=>base+(j*7+5)*DAY_MS;
  const weeks=[];
  for(let i=0;i<reportWeeks();i++){
    const pd=payDate(i),isHol=hol.includes(i),isDis=fm[i]==3;
    let ap=null;for(const p of prices)if(pd>=p.startMs)ap=p;
    let isPay=false;
    if(ap&&!isHol&&!isDis){
      let h=0;for(let j=0;j<=i;j++)if(skipped(j)&&payDate(j)>=ap.startMs)h++;
      const eff=Math.round((pd-ap.startMs)/(7*DAY_MS))-h;
      isPay=eff>=0&&eff%ap.cycle===0;
    }
    weeks.push({i,anchor:base+i*7*DAY_MS,isHol,isDis,activeP:ap,isPay,payState:Number(fm[i])||0,sessions:[]});
  }
  const groups=[];let pend=[];
  weeks.forEach(w=>{
    if(!w.activeP)return;pend.push(w);
    if(w.isPay){groups.push({number:groups.length+1,price:w.activeP.price,cycle:w.activeP.cycle,startLimit:w.activeP.startMs,payState:w.payState,payMs:payDate(w.i),weeks:pend,sessions:[]});pend=[]}
  });
  if(partial&&pend.length&&pend.some(w=>!w.isHol&&!w.isDis)){
    const lw=pend[pend.length-1];
    groups.push({number:groups.length+1,price:lw.activeP.price,cycle:lw.activeP.cycle,startLimit:lw.activeP.startMs,payState:0,payMs:null,isPartial:true,weeks:pend,sessions:[]});
  }
  const slots=(s.schedules||[]).filter(sc=>JS_DAY[sc.day]!=null);
  groups.forEach(g=>{
    g.weeks.forEach(w=>{
      if(w.isHol||w.isDis)return;
      const dow=new Date(w.anchor).getUTCDay();
      slots.forEach(sc=>{
        const date=w.anchor+((JS_DAY[sc.day]-dow+7)%7)*DAY_MS;
        if(date>=g.startLimit)w.sessions.push({date,day:sc.day,time:sc.time,min:timeToMinutes(sc.time)});
      });
      w.sessions.sort((a,b)=>a.date-b.date||a.min-b.min);g.sessions.push(...w.sessions);
    });
    g.startMs=Math.max(g.weeks[0].anchor,g.startLimit);g.endMs=g.weeks[g.weeks.length-1].anchor+6*DAY_MS;
  });
  return groups;
}
function periodRange(g){const a=new Date(g.startMs).getUTCFullYear(),b=new Date(g.endMs).getUTCFullYear();return(a===b?fmtShort(g.startMs):fmtLong(g.startMs))+' – '+fmtLong(g.endMs)}
function defaultPeriodIdx(gs){
  if(!gs.length)return 0;const n=new Date(),t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  let i=gs.findIndex(g=>t>=g.startMs&&t<=g.endMs);if(i<0)i=gs.findIndex(g=>g.startMs>t);return i<0?gs.length-1:i;
}
function periodReportHTML(s,idx,fin){
  const g=getPeriods(s)[idx];if(!g)return'';
  const td='padding:6px 10px;border-bottom:1px solid #334155;font-size:13px;';

  g.weeks.forEach(w=>{

    rows+=w.sessions.length?w.sessions.map(se=>`<tr><td style="${td}font-weight:bold">✦ ${FULL[se.day]||se.day}</td><td style="${td}color:#e2e8f0">${fmtLong(se.date)}</td><td style="${td}font-weight:bold;color:#38bdf8;text-align:right;white-space:nowrap">${se.time}</td></tr>`).join(''):`<tr><td colspan="3" style="${td}color:#94a3b8;text-align:center">No sessions</td></tr>`;

  if(!g.sessions.length)rows=`<tr><td colspan="3" style="${td}text-align:center;color:#94a3b8">No scheduled slots found for this student.</td></tr>`;
  let f='';
  if(fin){

  }
  return cardShell('Payment Period Schedule',studentBox(s,`<p style="margin:0;font-size:12px;color:#facc15;font-weight:bold">Period ${g.number} &nbsp;·&nbsp; ${periodRange(g)}</p><p style="margin:3px 0 0;font-size:11px;color:#94a3b8">${g.sessions.length} session${g.sessions.length===1?'':'s'} &nbsp;·&nbsp; every ${g.cycle} weeks</p>`),`<table style="${tblStyle}">${thHead('Day','Date','Time')}<tbody>${rows}</tbody></table>`,f);
}

/* ===== Account statement (cancel + merge sessions) ===== */
const sk=(d,t)=>d+'|'+t;
const keyLabel=k=>{const i=k.indexOf('|');return fmtShort(+k.slice(0,i))+' '+k.slice(i+1)};
function removeSource(s,k){const ms=s.mergedSessions||{};Object.keys(ms).forEach(t=>{ms[t]=(ms[t]||[]).filter(x=>x!==k);if(!ms[t].length)delete ms[t]})}
function computeStatement(s,cutoff){
  const groups=getPeriods(s,true),canc=s.cancelledSessions||{},ms=s.mergedSessions||{},src2t={};
  Object.keys(ms).forEach(t=>(ms[t]||[]).forEach(x=>{if(canc[x])src2t[x]=t}));
  const isCanc=se=>!!canc[sk(se.date,se.time)];
  const mult=se=>{const k=sk(se.date,se.time);return canc[k]?0:1+(ms[k]||[]).filter(x=>canc[x]).length};
  const perWeek=(s.schedules||[]).filter(sc=>JS_DAY[sc.day]!=null).length;
  const res={student:s,courses:[],days:[],earned:0,done:0,total:0,cancelled:0,lastPaid:null},all=[];
  groups.forEach(g=>{
    const total=g.isPartial?perWeek*g.cycle:g.sessions.length,rate=total?g.price/total:0;
    const upTo=g.sessions.filter(se=>se.date<=cutoff);
    if(!upTo.length&&g.startMs>cutoff)return;
    const done=upTo.filter(se=>!isCanc(se)),w=done.reduce((a,se)=>a+mult(se),0),canN=upTo.length-done.length;
    res.courses.push({number:g.number,range:periodRange(g),total,done:w,cancelled:canN,earned:(total&&w>=total)?g.price:round2(w*rate),payState:g.payState});
    upTo.forEach(se=>all.push({date:se.date,day:se.day,time:se.time,min:se.min,course:g.number,rate,cancelled:isCanc(se),mult:mult(se),to:src2t[sk(se.date,se.time)]||null}));
  });
  const lp=res.courses.reduce((m,c,i)=>c.payState===1?i:m,-1);
  res.courses.forEach((c,i)=>c.counted=c.payState===2||i>lp);
  res.lastPaid=lp>=0?res.courses[lp]:null;
  res.courses=res.courses.filter(c=>c.counted);
  const nums=new Set(res.courses.map(c=>c.number));
  all.filter(d=>nums.has(d.course)).sort((a,b)=>a.date-b.date||a.min-b.min).forEach(d=>res.days.push(d));
  let run=0;res.days.forEach(d=>{if(!d.cancelled)run+=d.rate*d.mult;d.running=round2(run)});
  res.courses.forEach(c=>{res.earned+=c.earned;res.done+=c.done;res.total+=c.total;res.cancelled+=c.cancelled});
  res.earned=round2(res.earned);return res;
}
function toggleCancelSession(id,dateMs,time){
  const s=db.students.find(x=>x.id===id);if(!s)return;commitChange();
  s.cancelledSessions=s.cancelledSessions||{};s.mergedSessions=s.mergedSessions||{};
  const k=sk(dateMs,time);
  if(s.cancelledSessions[k]){delete s.cancelledSessions[k];removeSource(s,k)}else{s.cancelledSessions[k]=true;delete s.mergedSessions[k]}
  save();runAccount();
}
function mergeSessions(id,sd,st,td,tt){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  const a=sk(sd,st),b=sk(td,tt);if(a===b)return;
  s.cancelledSessions=s.cancelledSessions||{};s.mergedSessions=s.mergedSessions||{};
  if(s.cancelledSessions[b]){showToast('Cannot merge into a cancelled session');return}
  if((s.mergedSessions[a]||[]).length){showToast('This session already has a compensation, unmerge it first');return}
  commitChange();s.cancelledSessions[a]=true;removeSource(s,a);(s.mergedSessions[b]=s.mergedSessions[b]||[]).push(a);
  save();runAccount();showToast('Merged ✅ session is now ×'+(1+s.mergedSessions[b].length));
}
function unmergeSession(id,d,t,asTarget){
  const s=db.students.find(x=>x.id===id);if(!s)return;commitChange();
  const k=sk(d,t);if(asTarget){if(s.mergedSessions)delete s.mergedSessions[k]}else removeSource(s,k);
  save();runAccount();
}

/* drag (mouse + touch) to merge */
(function(){
  const box=$('accountResult');let g=null;
  const rowAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('#accountResult tr[data-sid]'):null};
  box.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.acc-h');if(!h)return;const tr=h.closest('tr');e.preventDefault();
    const gh=document.createElement('div');gh.id='accGhost';gh.textContent='⠿ '+tr.children[1].textContent+' · '+tr.dataset.time;
    gh.style.left=(e.clientX+12)+'px';gh.style.top=(e.clientY-34)+'px';document.body.appendChild(gh);
    g={tr,gh,over:null};tr.classList.add('acc-row-drag');try{h.setPointerCapture(e.pointerId)}catch(_){}
  });
  box.addEventListener('pointermove',e=>{
    if(!g)return;g.gh.style.left=(e.clientX+12)+'px';g.gh.style.top=(e.clientY-34)+'px';
    const r=rowAt(e.clientX,e.clientY);if(g.over)g.over.classList.remove('acc-row-over');
    g.over=(r&&r!==g.tr&&r.dataset.sid===g.tr.dataset.sid)?r:null;if(g.over)g.over.classList.add('acc-row-over');
  });
  const end=ok=>{
    if(!g)return;const{tr,gh,over}=g;g=null;gh.remove();tr.classList.remove('acc-row-drag');if(over)over.classList.remove('acc-row-over');
    if(ok&&over)mergeSessions(+tr.dataset.sid,+tr.dataset.date,tr.dataset.time,+over.dataset.date,over.dataset.time);
  };
  box.addEventListener('pointerup',()=>end(true));box.addEventListener('pointercancel',()=>end(false));
})();

function openSlotModal(id,day,time){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  const sc=(s.schedules||[]).find(x=>x.day===day&&x.time===time)||{},st=sc.status||0;
  $('editFields').innerHTML=`<h3>Edit Session Slot ⏰</h3>
<label>Student Name</label><input value="${escHtml(s.name)}" disabled>
<label>Day</label><select id="eDay">${DAYS.map(d=>`<option ${d===day?'selected':''}>${d}</option>`).join('')}</select>
<label>Time</label><select id="eTime">${timeOptions(time)}</select>
<label>Attendance Status</label><select id="eStatus"><option value="0">Normal / Unspecified</option><option value="1" ${st===1?'selected':''}>Present (✓)</option><option value="2" ${st===2?'selected':''}>Absent (✕)</option><option value="3" ${st===3?'selected':''}>Cancelled (⟳)</option></select>
<label>Horizontal Offset (px)</label><input type="number" id="eOffset" value="${sc.offset||0}">
<button class="action-btn" style="width:100%;margin-top:10px;background:var(--primary);color:#fff" onclick="updateSlot(${id},'${day}','${time}')">Save Changes 💾</button>
<button class="action-btn" style="width:100%;margin-top:8px;background:#ef4444;color:#fff" onclick="deleteSlot(${id},'${day}','${time}')">Delete Slot 🗑️</button>`;
  openEditModal();
}
function updateSlot(id,day,time){
  commitChange();const s=db.students.find(x=>x.id===id),sc=s&&s.schedules.find(x=>x.day===day&&x.time===time);
  if(sc){sc.day=$('eDay').value;sc.time=$('eTime').value;sc.status=Number($('eStatus').value);sc.offset=Number($('eOffset').value)||0;save()}
  closeAll();
}
function deleteSlot(id,day,time){
  commitChange();const s=db.students.find(x=>x.id===id);
  if(s){s.schedules=s.schedules.filter(x=>!(x.day===day&&x.time===time));save()}closeAll();
}
function addSchedule(){
  const id=Number($('sSelect').value);if(!id)return;commitChange();
  const s=db.students.find(x=>x.id===id);
  if(s){(s.schedules=s.schedules||[]).push({day:$('cDay').value,time:$('cTime').value,offset:0,status:0});save()}closeAll();
}

/* ===== Students ===== */
function initColors(id,sel=PALETTE[0]){
  const t=$(id);if(!t)return;
  t.innerHTML=PALETTE.map(c=>`<div class="color-circle ${c===sel?'selected':''}" style="background:${c}" onclick="selectColor(this,'${id}','${c}')"></div>`).join('')+`<input type="hidden" id="hidden_${id}" value="${sel}">`;
}
function selectColor(el,id,c){document.querySelectorAll(`#${id} .color-circle`).forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('hidden_'+id).value=c}
function addStudent(){
  const n=$('sName').value;if(!n)return;commitChange();
  const address=$('sAddress').value.trim(),pl=window.__pendingLoc||null;
  const s={id:Date.now(),name:n,color:$('hidden_colorGridAdd').value,financialMap:{},schedules:[],address,lat:pl?pl.lat:null,lng:pl?pl.lng:null,distanceKm:null,
    periods:[{startDate:$('sDate').value,price:Number($('sPrice').value||0),cycle:Number($('sCycle').value||4)}]};
  if(pl&&db.teacherLat!=null)s.distanceKm=distTo(pl.lat,pl.lng);
  db.students.push(s);save();closeAll();
  $('sAddress').value='';window.__pendingLoc=null;$('newStudentGeoStatus').innerText='';
  if(!pl&&address&&db.teacherLat!=null)geocodeAddress(address).then(l=>{if(l){s.lat=l.lat;s.lng=l.lng;s.distanceKm=distTo(l.lat,l.lng);save()}});
}
function periodCard(p,removable){
  return `<div class="period-card"><label>Start Date</label><input type="date" class="p-date" value="${p.startDate}"><label>Price</label><input type="number" class="p-price" value="${p.price}"><label>Billing Cycle (every N weeks)</label><input type="number" class="p-cycle" value="${p.cycle}">${removable?'<button onclick="this.parentElement.remove()" style="color:red;background:none;border:none;position:absolute;top:5px;right:5px;font-weight:bold">X</button>':''}</div>`;
}
function addNewPeriod(){
  const d=document.createElement('div');d.innerHTML=periodCard({startDate:db.courseStartDate,price:0,cycle:4},true);
  $('editPeriods').appendChild(d.firstElementChild);
}
function openEdit(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  const gs=getPeriods(s),def=defaultPeriodIdx(gs);
  const pr=gs.length?`<div style="background:#fffbeb;padding:10px;border-radius:8px;margin-bottom:12px;border:1px solid #fcd34d"><div style="font-weight:bold;font-size:12px;color:#92400e;margin-bottom:4px">📅 Payment Period Report (for parent)</div><div style="font-size:10px;color:#78716c;margin-bottom:6px">Based on saved data — press "Save All Changes" first if you edited anything.</div><select id="reportPeriodSelect">${gs.map((g,i)=>`<option value="${i}" ${i===def?'selected':''}>Period ${g.number}: ${periodRange(g)}</option>`).join('')}</select><div style="display:flex;gap:5px"><button class="action-btn" style="flex:1;background:#0f172a;color:#fff;justify-content:center;margin:0" onclick="runPeriodReport('print',${id})">🖨️ PDF</button><button class="action-btn" style="flex:1;background:#10b981;color:#fff;justify-content:center;margin:0" onclick="runPeriodReport('image',${id})">📸 Image</button><button class="action-btn" style="flex:1;background:#0ea5e9;color:#fff;justify-content:center;margin:0" onclick="runPeriodReport('share',${id})">📤 Share</button></div></div>`:'<div style="background:#f1f5f9;padding:10px;border-radius:8px;margin-bottom:12px;font-size:11px;color:#64748b">📅 Add a billing period and save to enable the payment period report.</div>';
  const dist=s.distanceKm!=null?`<span class="distance-badge">📍 ${s.distanceKm} km from your home</span>`:(s.address?'<span class="distance-badge" style="background:#fef3c7;color:#92400e">Distance not calculated yet</span>':'');
  $('editFields').innerHTML=`<h3>Edit Student</h3>
<label>Name</label><input id="en" value="${escHtml(s.name)}">
<div id="ecg" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px"></div>
<div class="addr-row"><input id="eAddress" value="${escHtml(s.address||'')}" placeholder="Student address / area"><button class="loc-icon-btn" onclick="openMapPicker({type:'edit',id:${id}})">📍</button></div>
<div style="margin:-6px 0 12px">${dist}</div><hr>
<h4>Billing Periods</h4><div id="editPeriods">${(s.periods||[]).map((p,i)=>periodCard(p,i>0)).join('')}</div>
<button class="action-btn" style="width:100%;margin-bottom:10px;background:#f8fafc;border:1px solid #ddd" onclick="addNewPeriod()">+ Add Price Period</button>
<div style="background:#f1f5f9;padding:10px;border-radius:8px;margin-bottom:12px;border:1px solid #cbd5e1"><label style="display:flex;align-items:center;gap:8px;font-weight:bold"><input type="checkbox" id="includeFinancialsCheckbox" style="width:18px;margin:0"> Show Account & Price Details in Print/Image</label></div>
<div style="font-size:11px;font-weight:bold;color:#64748b;margin-bottom:4px">🗓️ Weekly schedule card</div>
<div style="display:flex;gap:5px;margin-bottom:8px"><button class="action-btn" style="flex:1;background:#0f172a;color:#fff;justify-content:center" onclick="printSingleStudent(${id})">🖨️ PDF</button><button class="action-btn" style="flex:1;background:#10b981;color:#fff;justify-content:center" onclick="downloadStudentImage(${id})">📸 Save Image</button></div>
<button class="action-btn" style="width:100%;background:#f59e0b;color:#000;justify-content:center;margin:0 0 8px" onclick="openAccount(${id})">💰 Account Statement (stop / balance)</button>
${pr}
<button class="action-btn" style="width:100%" onclick="updateStudent(${id})">Save All Changes</button>
<button class="action-btn" style="background:red;color:#fff;width:100%;margin-top:5px" onclick="delStudent(${id})">Delete Student</button>`;
  initColors('ecg',s.color);openEditModal();
}
function updateStudent(id){
  commitChange();const s=db.students.find(x=>x.id===id);
  if(s){
    s.name=$('en').value;s.color=$('hidden_ecg').value;
    const a=$('eAddress').value.trim();if(a!==s.address){s.lat=s.lng=s.distanceKm=null}s.address=a;
    s.periods=[...document.querySelectorAll('.period-card')].map(c=>({startDate:c.querySelector('.p-date').value,price:Number(c.querySelector('.p-price').value||0),cycle:Number(c.querySelector('.p-cycle').value||4)})).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    save();
    if(s.address&&s.lat==null&&db.teacherLat!=null)geocodeAddress(s.address).then(l=>{if(l){s.lat=l.lat;s.lng=l.lng;s.distanceKm=distTo(l.lat,l.lng);save()}});
  }
  closeAll();
}
function delStudent(id){if(confirm('Delete student and all their records?')){commitChange();db.students=db.students.filter(x=>x.id!==id);save();closeAll()}}

/* ===== Teacher photo ===== */
function photoDB(){return new Promise(res=>{const r=indexedDB.open("SmartTutorPhotoDB",1);r.onupgradeneeded=e=>e.target.result.createObjectStore("photos");r.onsuccess=e=>res(e.target.result);r.onerror=()=>res(null)})}
async function loadPhoto(){try{const d=await photoDB(),q=d.transaction("photos").objectStore("photos").get("teacherImg");q.onsuccess=()=>{if(q.result)$('teacherImg').src=q.result}}catch(e){}}
function handleImageUpload(input){
  if(!input.files||!input.files[0])return;
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=async()=>{
    const z=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=300;
    c.getContext('2d').drawImage(img,(img.width-z)/2,(img.height-z)/2,z,z,0,0,300,300);
    const url=c.toDataURL('image/jpeg',.85);$('teacherImg').src=url;
    const d=await photoDB();if(d)d.transaction("photos","readwrite").objectStore("photos").put(url,"teacherImg");
  };img.src=e.target.result};
  r.readAsDataURL(input.files[0]);
}

window.onload=()=>{loadPhoto();$('cTime').innerHTML=timeOptions();render()};
</script>
