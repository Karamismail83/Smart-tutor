<style>

const PALETTE = [
'#DC2626', '#F97316', '#D97706', '#A16207', '#65A30D', '#16A34A', '#047857', '#0D9488',
'#06B6D4', '#0284C7', '#2563EB', '#1E3A8A', '#4F46E5', '#7C3AED', '#A855F7', '#C026D3',
'#EC4899', '#E11D48', '#9F1239', '#78350F', '#3F6212', '#701A75', '#6B7280', '#A8875A'
];
const daysOrder = ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"];
const DEFAULT_REGION_LAT = 25.3838;
const DEFAULT_REGION_LNG = 49.5922;
const DEFAULT_REGION_ZOOM = 11; // wide enough to see Al-Hofuf, Al-Mubarraz and surrounding villages together
const dayNamesMap = {
"Sat": "Sat",
"Sun": "Sun",
"Mon": "Mon",
"Tue": "Tue",
"Wed": "Wed",
"Thu": "Thu",
"Fri": "Fri"
};
const dayNamesFull = {
"Sat": "Saturday",
"Sun": "Sunday",
"Mon": "Monday",
"Tue": "Tuesday",
"Wed": "Wednesday",
"Thu": "Thursday",
"Fri": "Friday"
};
let db;
try {
db = JSON.parse(localStorage.getItem('tutor_v390')) || { students: [], holidays: [], teacherName: '', teacherPhone: '', courseStartDate: new Date().toISOString().slice(0,10) };
} catch(e) {
db = { students: [], holidays: [], teacherName: '', teacherPhone: '', courseStartDate: new Date().toISOString().slice(0,10) };
}
let historyStack = [];
let draggedData = null;
function showToast(message) {
let toast = document.getElementById('toast');
toast.innerText = message;
toast.classList.add('show');
setTimeout(() => { toast.classList.remove('show'); }, 2500);
}
function getTimeOptionsHTML(selectedTime = '') {
let html = '';
for(let h = 10; h <= 22; h++){
for(let m of [0, 15, 30, 45]){
if(h === 22 && m > 0) continue;
let hh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
let mm = m.toString().padStart(2, '0');
let ampm = h < 12 ? 'AM' : 'PM';
let t = `${hh}:${mm} ${ampm}`;
let isSel = (t === selectedTime) ? 'selected' : '';
html += `<option value="${t}" ${isSel}>${t}</option>`;
}
}
return html;
}
function initLessonTimes() {
const sel = document.getElementById('cTime');

async function placesSearch(query, limit = 8, biasLat = null, biasLon = null) {

try { results = results.concat(await nominatimSearch(q, limit, biasLat, biasLon)); } catch (e) { /* offline or blocked */ }

candidates.push(segs.join(', '));      // all place-name segments together
candidates.push(segs[segs.length - 1]); // last segment (often the city)
candidates.push(segs[0]);               // first segment (often the district)
segs.forEach(s => {

s.split(/\band\b/i).forEach(p => { if (p.trim()) candidates.push(p.trim()); });
}
});
}
}
const words = query.trim().split(/\s+/);
if (words.length > 1) {
candidates.push(words.slice(1).join(' '));
candidates.push(words.slice(0, -1).join(' '));
}

if (!candidate) continue;
results = await oneAttempt(candidate);
if (results.length) break;
}
}

for (const r of results) {

function haversineKm(lat1, lon1, lat2, lon2) {

}

function timeToMinutes(t) {
if (!t) return 0;
let parts = t.split(' ');
if(parts.length < 2) return 0;
let [time, ampm] = parts;
let timeParts = time.split(':');
if(timeParts.length < 2) return 0;
let hrs = Number(timeParts[0]);
let mins = Number(timeParts[1]);
if (ampm === 'PM' && hrs !== 12) hrs += 12;
if (ampm === 'AM' && hrs === 12) hrs = 0;
return hrs * 60 + mins;
}

    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str || '');

function getStudentPaymentPeriods(s, includePartial = false) {
    const base = ymdToUTC(db.courseStartDate || new Date().toISOString().slice(0, 10));
    if (base == null) return [];
    const prices = (s.periods || [])
        .map(p => ({ price: Number(p.price) || 0, cycle: Number(p.cycle) || 4, startMs: ymdToUTC(p.startDate) }))
        .filter(p => p.startMs != null)
        .sort((a, b) => a.startMs - b.startMs);
    if (!prices.length) return [];
    const hol = db.holidays || [];
    const fm = s.financialMap || {};
    const skippedAt = j => hol.includes(j) || fm[j] == 3;
    const payDateOf = j => base + (j * 7 + 5) * DAY_MS; // the date shown in the accounts-table header
    // 1) Walk every week exactly like the accounts table does, and find the payment weeks
    const weeks = [];
    for (let i = 0; i < REPORT_WEEKS; i++) {
        const anchor = base + i * 7 * DAY_MS;
        const payDate = payDateOf(i);
        const isHol = hol.includes(i);
        const isDis = fm[i] == 3;
        let activeP = null;
        for (const p of prices) if (payDate >= p.startMs) activeP = p;
        let isPay = false;
        if (activeP && !isHol && !isDis) {
            const totalWeeks = Math.round((payDate - activeP.startMs) / (7 * DAY_MS));
            let hCount = 0;
            for (let j = 0; j <= i; j++) if (skippedAt(j) && payDateOf(j) >= activeP.startMs) hCount++;
            const eff = totalWeeks - hCount;
            if (eff >= 0 && eff % activeP.cycle === 0) isPay = true;
        }
        weeks.push({ i, anchor, isHol, isDis, activeP, isPay, payState: Number(fm[i]) || 0, sessions: [] });
    }
    // 2) Group the weeks: a period is the block of weeks that ENDS on a payment week
    //    (the parent pays at the end of each cycle, for the weeks just taught)
    const groups = [];
    let pending = [];
    weeks.forEach(w => {
        if (!w.activeP) return; // before the student's start date
        pending.push(w);
        if (w.isPay) {
            groups.push({
                number: groups.length + 1, price: w.activeP.price, cycle: w.activeP.cycle,
                startLimit: w.activeP.startMs, payState: w.payState, payMs: payDateOf(w.i),
                weeks: pending, sessions: []
            });
            pending = [];
        }
    });
    // 2b) optionally keep the last, still-open course (weeks after the final payment week)
    if (includePartial && pending.length && pending.some(w => !w.isHol && !w.isDis)) {
        const lw = pending[pending.length - 1];
        groups.push({
            number: groups.length + 1, price: lw.activeP.price, cycle: lw.activeP.cycle,
            startLimit: lw.activeP.startMs, payState: 0, payMs: null, isPartial: true,
            weeks: pending, sessions: []
        });
        pending = [];
    }
    // 3) Put the real calendar date of every weekly slot inside each week
    const slots = (s.schedules || []).filter(sc => JS_DAY[sc.day] != null);
    groups.forEach(g => {
        g.weeks.forEach(w => {
            if (w.isHol || w.isDis) return;
            const anchorDow = new Date(w.anchor).getUTCDay();
            slots.forEach(sc => {
                const date = w.anchor + ((JS_DAY[sc.day] - anchorDow + 7) % 7) * DAY_MS;
                if (date < g.startLimit) return; // before the student's start date
                w.sessions.push({ date, day: sc.day, time: sc.time, min: timeToMinutes(sc.time) });
            });
            w.sessions.sort((a, b) => a.date - b.date || a.min - b.min);
            g.sessions.push(...w.sessions);
        });
        g.startMs = Math.max(g.weeks[0].anchor, g.startLimit);
        g.endMs = g.weeks[g.weeks.length - 1].anchor + 6 * DAY_MS;
    });
    return groups;
}

    const sy = new Date(g.startMs).getUTCFullYear(), ey = new Date(g.endMs).getUTCFullYear();

    const now = new Date();
    const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    let idx = groups.findIndex(g => today >= g.startMs && today <= g.endMs);
    if (idx === -1) idx = groups.findIndex(g => g.startMs > today);
    return idx === -1 ? groups.length - 1 : idx;
}

function buildReportCanvas(html) {

        const tempDiv = document.createElement('div');
        tempDiv.style.cssText = 'position:absolute; left:-9999px; top:0; width:520px;';
        tempDiv.innerHTML = html;
        document.body.appendChild(tempDiv);

async function savePeriodImage(studentId, periodIdx, includeFinancials = false, includePhone = false, share = false) {
    const student = db.students.find(s => s.id === studentId);
    if (!student) return;
    const html = generatePeriodReportHTML(student, periodIdx, includeFinancials, includePhone);
    if (!html) { alert('No payment period found. Add a billing period first.'); return; }
    if (typeof html2canvas === 'undefined') { alert('The image library could not be loaded. Please check your internet connection.'); return; }
    showToast('Preparing image…');
    try {
        const canvas = await buildReportCanvas(html);
        const g = getStudentPaymentPeriods(student)[periodIdx];
        const safeName = String(student.name).replace(/[^\w\u0600-\u06FF-]+/g, '_');
        const fileName = `Period_${g.number}_${safeName}.png`;
        if (share && navigator.canShare && navigator.share) {
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            if (blob) {
                const file = new File([blob], fileName, { type: 'image/png' });
                if (navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: `${student.name} – Period ${g.number}` });
                        return;
                    } catch (e) {
                        if (e && e.name === 'AbortError') return; // user closed the share sheet
                        // any other error → fall back to a normal download below
                    }
                }
            }
        }
        const link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('Image saved ✅');
    } catch (e) {
        alert('Could not create the image. Please try again.');
    }
}

/* =====================================================================
   ACCOUNT STATEMENT
   Pick a student (or all) + a stop date + "start / end of day" and get:
   - every session up to that moment, with its price and a running total
   - the total for each course (billing period): done / total, earned, paid
   Price per session = course price / number of sessions in that course.
   Holiday weeks and paused weeks have no sessions, so they never cost money.
   Balance = earned so far - paid   (positive = student owes, negative = paid ahead)
   ===================================================================== */
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function money(n) { return round2(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function todayYMD() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function computeStudentStatement(s, cutoffMs, endOfDay) {
    const groups = getStudentPaymentPeriods(s, true);
    const slotsPerWeek = (s.schedules || []).filter(sc => JS_DAY[sc.day] != null).length;
    const res = { student: s, courses: [], days: [], total: 0, done: 0, earned: 0, paid: 0, price: 0, hidden: 0 };
    groups.forEach(g => {
        const total = g.isPartial ? slotsPerWeek * g.cycle : g.sessions.length;
        const rate = total ? g.price / total : 0;
        const isDone = se => endOfDay ? se.date <= cutoffMs : se.date < cutoffMs;
        const doneList = g.sessions.filter(isDone);
        // courses that start after the stop date are not part of the account yet
        if (!doneList.length && g.startMs > cutoffMs) { res.hidden++; return; }
        const earned = (total && doneList.length >= total) ? g.price : round2(doneList.length * rate);
        const paid = g.payState === 1 ? g.price : 0;
        res.courses.push({
            number: g.number, range: periodRangeText(g), price: g.price, cycle: g.cycle, isPartial: !!g.isPartial,
            total, done: doneList.length, rate, earned, paid, payState: g.payState, payMs: g.payMs, balance: round2(earned - paid)
        });
        doneList.forEach(se => res.days.push({ date: se.date, day: se.day, time: se.time, min: se.min, course: g.number, rate }));
        res.total += total; res.done += doneList.length; res.earned += earned; res.paid += paid; res.price += g.price;
    });
    res.days.sort((a, b) => a.date - b.date || a.min - b.min);
    let run = 0;
    res.days.forEach(d => { run += d.rate; d.running = round2(run); });
    res.earned = round2(res.earned); res.paid = round2(res.paid);
    res.balance = round2(res.earned - res.paid);
    return res;
}

function enableHorizontalDrag() {
let isDraggingHorizontal = false;
let startX = 0;
let currentSlot = null;
let initialOffset = 0;
document.querySelectorAll('.slot').forEach(slot => {
slot.addEventListener('mousedown', (e) => {
if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
isDraggingHorizontal = true;
currentSlot = slot;
startX = e.clientX;
initialOffset = parseFloat(slot.getAttribute('data-offset')) || 0;
slot.style.zIndex = '100';
});
});
window.addEventListener('mousemove', (e) => {
if (!isDraggingHorizontal || !currentSlot) return;
let diffX = e.clientX - startX;
let newOffset = initialOffset + diffX;
currentSlot.style.marginLeft = `${newOffset}px`;
});
window.addEventListener('mouseup', () => {
if (isDraggingHorizontal && currentSlot) {
let sId = Number(currentSlot.getAttribute('data-studentid'));
let day = currentSlot.getAttribute('data-day');
let time = currentSlot.getAttribute('data-time');
let finalMarginLeft = parseFloat(currentSlot.style.marginLeft) || 0;
let student = db.students.find(s => s.id === sId);
if (student && student.schedules) {
let targetSlot = student.schedules.find(s => s.day === day && s.time === time);
if (targetSlot) {
commitChange();
targetSlot.offset = Math.round(finalMarginLeft);
save();
}
}
isDraggingHorizontal = false;
currentSlot = null;
}
});

s.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, loc.lat, loc.lng) * 10) / 10;
save();
openEdit(id);
} else {
alert('Could not locate this address, try writing it more clearly or use the map');
}
}
function addNewPeriod() {
const div = document.createElement('div');
div.className = 'period-card';
let defaultDate = db.courseStartDate || new Date().toISOString().slice(0,10);
div.innerHTML = `<label>Start Date</label><input type="date" class="p-date" value="${defaultDate}"><label>Price</label><input type="number" class="p-price" value="0"><label>Billing Cycle (every N weeks)</label><input type="number" class="p-cycle" value="4"><button onclick="this.parentElement.remove()" style="color:red; background:none; border:none; position:absolute; top:5px; right:5px; font-weight:bold">X</button>`;
document.getElementById('editPeriods').appendChild(div);
}
function up(id) {
commitChange();
let s = db.students.find(x => x.id === id);
if(s) {
s.name = document.getElementById('en').value;
s.color = document.getElementById('hidden_ecg').value;
let newAddress = document.getElementById('eAddress')?.value.trim() || '';
if (newAddress !== s.address) { s.lat = null; s.lng = null; s.distanceKm = null; }
s.address = newAddress;
let newPeriods = [];
document.querySelectorAll('.period-card').forEach(card => {
newPeriods.push({
startDate: card.querySelector('.p-date').value,
price: Number(card.querySelector('.p-price').value || 0),
cycle: Number(card.querySelector('.p-cycle').value || 4)
});
});
s.periods = newPeriods.sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
save();
if (s.address && s.lat == null && db.teacherLat != null) {
geocodeAddress(s.address).then(loc => {
if (loc) {
s.lat = loc.lat; s.lng = loc.lng;
s.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, loc.lat, loc.lng) * 10) / 10;
save();
}
});
}
}
closeAll();
}
function del(id) {
if(confirm('Delete student and all their records?')) {
commitChange();
db.students = db.students.filter(x => x.id !== id);
save();
closeAll();
}
}
async function loadPhoto() {
try {
let d = await openPhotoDB();
let req = d.transaction("photos", "readonly").objectStore("photos").get("teacherImg");
req.onsuccess = () => { if(req.result) document.getElementById('teacherImg').src = req.result; };
} catch(e) {}
}
function openPhotoDB() {
return new Promise((res) => {
let req = indexedDB.open("SmartTutorPhotoDB", 1);
req.onupgradeneeded = (e) => e.target.result.createObjectStore("photos");
req.onsuccess = (e) => res(e.target.result);
req.onerror = () => res(null);
});
}
function handleImageUpload(input) {
if (input.files && input.files[0]) {
const reader = new FileReader();
reader.onload = (e) => {
const img = new Image();
img.onload = async () => {
const canvas = document.createElement('canvas');
canvas.width = 150; canvas.height = 150;
canvas.getContext('2d').drawImage(img,0,0,150,150);
const url = canvas.toDataURL('image/jpeg', 0.7);
document.getElementById('teacherImg').src = url;
let d = await openPhotoDB();
if(d) d.transaction("photos", "readwrite").objectStore("photos").put(url, "teacherImg");
};
img.src = e.target.result;
};
reader.readAsDataURL(input.files[0]);
}
}
window.onload = () => { loadPhoto(); initLessonTimes(); render(); };
</script>
