            <input type="number" id="editSlotOffset" value="${currentOffset}" placeholder="e.g. 20 or -10">

            <button class="action-btn" style="width:100%; margin-top:10px; background:var(--primary); color:white;" onclick="updateSlot(${studentId}, '${currentDay}', '${currentTime}')">Save Changes 💾</button>
            <button class="action-btn" style="width:100%; margin-top:8px; background:#ef4444; color:white;" onclick="deleteSlot(${studentId}, '${currentDay}', '${currentTime}')">Delete Slot 🗑️</button>
        `;

        document.getElementById('editModal').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }

    function updateSlot(studentId, oldDay, oldTime) {
        let newDay = document.getElementById('editSlotDay').value;
        let newTime = document.getElementById('editSlotTime').value;
        let newStatus = Number(document.getElementById('editSlotStatus').value);
        let newOffset = Number(document.getElementById('editSlotOffset').value) || 0;

        commitChange();
        let student = db.students.find(s => s.id === studentId);
        if (student && student.schedules) {
            let slot = student.schedules.find(s => s.day === oldDay && s.time === oldTime);
            if (slot) {
                slot.day = newDay;
                slot.time = newTime;
                slot.status = newStatus;
                slot.offset = newOffset;
                save();
            }
        }
        closeAll();
    }

    function deleteSlot(studentId, day, time) {
        commitChange();
        let student = db.students.find(s => s.id === studentId);
        if (student && student.schedules) {
            student.schedules = student.schedules.filter(s => !(s.day === day && s.time === time));
            save();
        }
        closeAll();
    }

    function th(i) { 
        commitChange(); 
        if(!db.holidays) db.holidays = [];
        let idx = db.holidays.indexOf(i); 
        if(idx > -1) db.holidays.splice(idx,1); 
        else db.holidays.push(i); 
        save(); 
    }

    function st(id, i) { 
        commitChange(); 
        let s = db.students.find(x => x.id === id); 
        if(s) {
            if(!s.financialMap) s.financialMap = {}; 
            s.financialMap[i] = ((s.financialMap[i] || 0) + 1) % 3; 
            save(); 
        }
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
    function closeAll() { document.querySelectorAll('.sidebar, .modal, .overlay').forEach(el => el.classList.remove('active')); }
    
    function initColors(id, radioName, sel = PALETTE[0]) { 
        const target = document.getElementById(id);
        if(!target) return;
        target.innerHTML = PALETTE.map(c => `<div class="color-circle ${c === sel ? 'selected' : ''}" style="background:${c}" onclick="selectColor(this, '${id}', '${radioName}', '${c}')"></div>`).join('') + `<input type="hidden" id="hidden_${id}" value="${sel}">`; 
    }
    
    function selectColor(el, cid, r, c) { document.querySelectorAll(`#${cid} .color-circle`).forEach(x => x.classList.remove('selected')); el.classList.add('selected'); document.getElementById(`hidden_${cid}`).value = c; }
    
    function addStudent() { 
        let n = document.getElementById('sName').value, col = document.getElementById('hidden_colorGridAdd').value;
        if(!n) return; commitChange(); 
        if(!db.students) db.students = [];
        let address = document.getElementById('sAddress')?.value.trim() || '';
        let preferredSchedule = getPrefSchedule('sPrefDays');
        let pendingLoc = window.__pendingStudentLoc || null;
        let newStudent = { 
            id: Date.now(), 
            name: n, 
            color: col, 
            financialMap: {}, 
            schedules: [], 
            address, preferredSchedule,
            lat: pendingLoc ? pendingLoc.lat : null,
            lng: pendingLoc ? pendingLoc.lng : null,
            distanceKm: null,
            periods: [{ startDate: document.getElementById('sDate').value, price: Number(document.getElementById('sPrice').value || 0), cycle: Number(document.getElementById('sCycle').value || 4) }] 
        };
        if (pendingLoc && db.teacherLat != null) {
            newStudent.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, pendingLoc.lat, pendingLoc.lng) * 10) / 10;
        }
        db.students.push(newStudent); 
        save(); closeAll();
        document.getElementById('sAddress').value = '';
        window.__pendingStudentLoc = null;
        let ns = document.getElementById('newStudentGeoStatus');
        if (ns) ns.innerText = '';
        buildDayPrefUI('sPrefDays', []);
        if (!pendingLoc && address && db.teacherLat != null) {
            geocodeAddress(address).then(loc => {
                if (loc) {
                    newStudent.lat = loc.lat; newStudent.lng = loc.lng;
                    newStudent.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, loc.lat, loc.lng) * 10) / 10;
                    save();
                }
            });
        }
    }
    
    function addSchedule() { 
        let id = Number(document.getElementById('sSelect').value);
        let d = document.getElementById('cDay').value;
        let t = document.getElementById('cTime').value; 
        if(!id) return; 
        commitChange(); 
        let student = db.students.find(x => x.id === id);
        if(student) {
            if(!student.schedules) student.schedules = [];
            student.schedules.push({ day: d, time: t, offset: 0, status: 0 }); 
            save(); 
        }
        closeAll(); 
    }

    function openEdit(id) {
        const s = db.students.find(x => x.id === id);
        if(!s) return;
        let phtml = (s.periods || []).map((p, idx) => `
            <div class="period-card">
                <label>Start Date</label><input type="date" class="p-date" value="${p.startDate}">
                <label>Price</label><input type="number" class="p-price" value="${p.price}">
                <label>Billing Cycle (every N weeks)</label><input type="number" class="p-cycle" value="${p.cycle}">
                ${idx > 0 ? `<button onclick="this.parentElement.remove()" style="color:red; background:none; border:none; position:absolute; top:5px; right:5px; font-weight:bold">X</button>` : ''}
            </div>`).join('');

        let distHtml = s.distanceKm != null ? `<span class="distance-badge">📍 ${s.distanceKm} km from your home</span>` : (s.address ? `<span class="distance-badge" style="background:#fef3c7;color:#92400e;">Distance not calculated yet</span>` : '');

        document.getElementById('editFields').innerHTML = `
            <h3>Edit Student</h3>
            <label>Name</label><input id="en" value="${s.name}">
            <div id="ecg" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px"></div>

            <label style="font-size:11px; color:#64748b;">📍 Student Address/Area</label>
            <div class="addr-row">
                <input id="eAddress" value="${s.address || ''}" placeholder="e.g. Uptown, Springfield">
                <button type="button" class="loc-icon-btn" onclick="openMapPicker({type:'edit', id:${s.id}})" title="Set location on map">📍</button>
            </div>
            <div style="margin:-6px 0 12px;">${distHtml}</div>

            <label style="font-size:11px; color:#64748b;">📅 الأيام المفضلة (اضغط على اليوم لتحديد ساعاته الخاصة)</label>
            <div id="ePrefDays_pills" style="margin-bottom:6px;"></div>
            <div id="ePrefDays_times" style="margin-bottom:12px;"></div>

            <hr>
            <h4>Billing Periods</h4>
            <div id="editPeriods">${phtml}</div>
            <button class="action-btn" style="width:100%; margin-bottom:10px; background:#f8fafc; border:1px solid #ddd" onclick="addNewPeriod()">+ Add Price Period</button>
            
            <div style="background:#f1f5f9; padding:10px; border-radius:8px; margin-bottom:12px; border:1px solid #cbd5e1;">
                <label style="display:flex; align-items:center; gap:8px; font-weight:bold; cursor:pointer; color:#0f172a; margin-bottom:8px;">
                    <input type="checkbox" id="includeFinancialsCheckbox" style="width:18px; height:18px; margin:0;"> Show Account & Price Details in Print/Image
                </label>
                <label style="display:flex; align-items:center; gap:8px; font-weight:bold; cursor:pointer; color:#0f172a;">
                    <input type="checkbox" id="includePhoneCheckbox" checked style="width:18px; height:18px; margin:0;"> Show Teacher Phone Number 📱 in Print/Image
                </label>
            </div>

            <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                <button class="action-btn" style="flex:1; background:#0f172a; color:white; justify-content:center;" onclick="printSingleStudent(${s.id}, document.getElementById('includeFinancialsCheckbox').checked, document.getElementById('includePhoneCheckbox').checked)">🖨️ PDF</button>
                <button class="action-btn" style="flex:1; background:#10b981; color:white; justify-content:center;" onclick="downloadStudentImage(${s.id}, document.getElementById('includeFinancialsCheckbox').checked, document.getElementById('includePhoneCheckbox').checked)">📸 Save Image</button>
            </div>

            <button class="action-btn" style="width:100%" onclick="up(${id})">Save All Changes</button>
            <button class="action-btn" style="background:red;color:white;width:100%;margin-top:5px" onclick="del(${id})">Delete Student</button>
        `;
        initColors('ecg', 'eColor', s.color);
        buildDayPrefUI('ePrefDays', getStudentPrefSchedule(s));
        document.getElementById('editModal').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }

    async function recomputeStudentDistance(id) {
        let s = db.students.find(x => x.id === id);
        if (!s) return;
        let address = document.getElementById('eAddress').value.trim();
        if (!address) { alert('Please enter the student\'s address first'); return; }
        if (db.teacherLat == null) { alert('You need to save your home address from Settings first'); return; }
        const loc = await geocodeAddress(address);
        if (loc) {
            commitChange();
            s.address = address;
            s.lat = loc.lat; s.lng = loc.lng;
            s.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, loc.lat, loc.lng) * 10) / 10;
            save();
            openEdit(id);
        } else {
            alert('Could not locate this address, try writing it more clearly or use the map');
        }
    }

    function addNewPeriod() {
        const div = document.createElement('div');
        div.className = 'period-card';
        let defaultDate = db.courseStartDate || new Date().toISOString().slice(0,10);
        div.innerHTML = `<label>Start Date</label><input type="date" class="p-date" value="${defaultDate}"><label>Price</label><input type="number" class="p-price" value="0"><label>Billing Cycle (every N weeks)</label><input type="number" class="p-cycle" value="4"><button onclick="this.parentElement.remove()" style="color:red; background:none; border:none; position:absolute; top:5px; right:5px; font-weight:bold">X</button>`;
        document.getElementById('editPeriods').appendChild(div);
    }

    function up(id) {
        commitChange();
        let s = db.students.find(x => x.id === id);
        if(s) {
            s.name = document.getElementById('en').value;
            s.color = document.getElementById('hidden_ecg').value;
            let newAddress = document.getElementById('eAddress')?.value.trim() || '';
            if (newAddress !== s.address) { s.lat = null; s.lng = null; s.distanceKm = null; }
            s.address = newAddress;
            s.preferredSchedule = getPrefSchedule('ePrefDays');
            let newPeriods = [];
            document.querySelectorAll('.period-card').forEach(card => {
                newPeriods.push({
                    startDate: card.querySelector('.p-date').value,
                    price: Number(card.querySelector('.p-price').value || 0),
                    cycle: Number(card.querySelector('.p-cycle').value || 4)
                });
            });
            s.periods = newPeriods.sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
            save(); 
            if (s.address && s.lat == null && db.teacherLat != null) {
                geocodeAddress(s.address).then(loc => {
                    if (loc) {
                        s.lat = loc.lat; s.lng = loc.lng;
                        s.distanceKm = Math.round(haversineKm(db.teacherLat, db.teacherLng, loc.lat, loc.lng) * 10) / 10;
                        save();
                    }
                });
            }
        }
        closeAll();
    }

    function del(id) { 
        if(confirm('Delete student and all their records?')) { 
            commitChange(); 
            db.students = db.students.filter(x => x.id !== id); 
            save(); 
            closeAll(); 
        } 
    }

    async function loadPhoto() { 
        try {
            let d = await openPhotoDB(); 
            let req = d.transaction("photos", "readonly").objectStore("photos").get("teacherImg"); 
            req.onsuccess = () => { if(req.result) document.getElementById('teacherImg').src = req.result; }; 
        } catch(e) {}
    }

    function openPhotoDB() { 
        return new Promise((res) => { 
            let req = indexedDB.open("SmartTutorPhotoDB", 1); 
            req.onupgradeneeded = (e) => e.target.result.createObjectStore("photos"); 
            req.onsuccess = (e) => res(e.target.result); 
            req.onerror = () => res(null);
        }); 
    }

    function handleImageUpload(input) { 
        if (input.files && input.files[0]) { 
            const reader = new FileReader(); 
            reader.onload = (e) => { 
                const img = new Image(); 
                img.onload = async () => { 
                    const canvas = document.createElement('canvas'); 
                    canvas.width = 150; canvas.height = 150; 
                    canvas.getContext('2d').drawImage(img,0,0,150,150); 
                    const url = canvas.toDataURL('image/jpeg', 0.7); 
                    document.getElementById('teacherImg').src = url; 
                    let d = await openPhotoDB(); 
                    if(d) d.transaction("photos", "readwrite").objectStore("photos").put(url, "teacherImg"); 
                }; 
                img.src = e.target.result; 
            }; 
            reader.readAsDataURL(input.files[0]); 
        } 
    }

    window.onload = () => { loadPhoto(); initLessonTimes(); render(); };
</script>
</body>
